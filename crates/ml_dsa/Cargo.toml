[package]
name = "ml_dsa"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "getrandom"]
std = ["mlrust_core/std"]
getrandom = ["mlrust_core/getrandom"]


[dependencies]
mlrust_core = {path = "../mlrust_core" }
subtle = "2.6.1"
zeroize = { version = "1", default-features = false }

[dev-dependencies]
sha3 = "0.10" 